name: Rebuild the organelle atlas index

# The atlas (/organelles.html) reads graphs and annotation straight from
# ARU-life-sciences/plant_organelle_database; this job refreshes the small
# species index that points at them, and commits it only when it changed.
on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old=$(python3 -c "import json; print(json.load(open('data/organelles.json'))['commit'])" 2>/dev/null || echo none)
          python3 scripts/build_organelle_index.py --out data/organelles.json
          new=$(python3 -c "import json; print(json.load(open('data/organelles.json'))['commit'])")
          echo "changed=$([ "$old" != "$new" ] && echo yes || echo no)" >> "$GITHUB_ENV"
      - name: Commit if the database changed
        if: env.changed == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/organelles.json
          git commit -m "Update the organelle atlas index"
          git push
