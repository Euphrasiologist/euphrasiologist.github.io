---
layout: default
---
    <section class="page-head">
      <div class="wrap">
        <p class="eyebrow"><a href="/news.html">News</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
        <h1>{{ page.title }}</h1>
        {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <article class="prose post-body">
{{ content }}
        </article>
        <p class="post-back"><a class="link-arrow" href="/news.html">All news</a></p>
      </div>
    </section>
